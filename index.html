<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulso – Demos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 1080' fill='%23222222'><circle cx='537.11' cy='478.14' r='71.79'/><path d='M401.92,275.04c-113.15,75.34-140.86,230.03-64.89,342.75l171.39,254.31c11.36,11.36,29.03,6.69,29.03-10.17l-.05-122.94-119.43-177.2c-44.37-65.84-28.7-158.73,36.77-203.65,69.89-47.95,166.52-26.57,209.12,48.42,35.7,62.85,18.95,143.77-38.65,187.44-25.38,19.24-54.75,28.81-83.98,29.61l.09,86.68c.73,9.07,8.88,15.56,17.92,14.51,40.07-4.69,86.11-23.76,121.32-49.31,98.86-71.74,128.57-220.31,64.79-324.49-72.78-118.88-228.78-152.28-343.42-75.95Z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F1EFEA;
      color: #222222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #E5E1D8;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222222;
    }

    .logo-mark svg { width: 30px; height: 30px; display: block; }

    .logo-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #222222;
      letter-spacing: 0.01em;
    }

    .header-tag {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: #6E6E6E;
      background: #F1EFEA;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px;
    }

    /* ── Cards grid ── */
    .demos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .demo-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #E5E1D8;
      overflow: hidden;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .demo-card:hover {
      box-shadow: 0 8px 24px rgba(34, 34, 34, 0.08);
      transform: translateY(-2px);
    }

    .demo-card-accent { height: 5px; }

    .demo-card-body {
      padding: 20px 22px 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .demo-type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: #F1EFEA;
      color: #6E6E6E;
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }

    .demo-icon {
      font-size: 26px;
      margin-bottom: 8px;
      display: block;
    }

    .demo-name {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: #222222;
      line-height: 1.3;
      margin-bottom: 8px;
      letter-spacing: -0.005em;
    }

    .demo-description {
      font-size: 13px;
      color: #6E6E6E;
      line-height: 1.55;
      flex: 1;
      margin-bottom: 20px;
    }

    .demo-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      transition: filter 0.15s;
      align-self: flex-start;
    }

    .demo-btn:hover { filter: brightness(0.9); }

    .demo-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #B5B5B5;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
        <circle cx="537.11" cy="478.14" r="71.79" fill="currentColor"/>
        <path d="M401.92,275.04c-113.15,75.34-140.86,230.03-64.89,342.75l171.39,254.31c11.36,11.36,29.03,6.69,29.03-10.17l-.05-122.94-119.43-177.2c-44.37-65.84-28.7-158.73,36.77-203.65,69.89-47.95,166.52-26.57,209.12,48.42,35.7,62.85,18.95,143.77-38.65,187.44-25.38,19.24-54.75,28.81-83.98,29.61l.09,86.68c.73,9.07,8.88,15.56,17.92,14.51,40.07-4.69,86.11-23.76,121.32-49.31,98.86-71.74,128.57-220.31,64.79-324.49-72.78-118.88-228.78-152.28-343.42-75.95Z" fill="currentColor"/>
      </svg>
    </div>
    <span class="logo-text">Pulso</span>
    <span class="header-tag">Demos</span>
  </header>

  <main>
    <div class="demos-grid" id="demos-grid"></div>
  </main>

  <footer>Marco Labs · Pulso</footer>

  <script>
    // ─── Event configuration ──────────────────────────────────────────────
    // Update this object to switch the active event context across all demos.
    const EVENT = {
      name:     "A la tardor, platillos",
      edition:  "11a edició",
      location: "L'Hospitalet de Llobregat",
      dates:    "6 – 23 nov 2025",
      color:    "#FF6B00",
    };

    // ─── Demo screens ─────────────────────────────────────────────────────
    // Each screen is an independent view of the platform for a given event.
    const SCREENS = [
      {
        icon:        "🗺️",
        name:        "Mapa d'esdeveniments",
        type:        "Experiència usuari",
        description: "Vista jeràrquica del territori: des de la província fins al carrer. Seguiment en temps real dels participants i establiments.",
        href:        "explore.html",
        color:       "#2563EB",
      },
      {
        icon:        "📍",
        name:        "A prop teu",
        type:        "Experiència usuari",
        description: "Descobreix què tens al teu abast segons la ubicació i el temps disponible, amb isòcrones a peu i en transport públic.",
        href:        "nearme.html",
        color:       "#0EA5E9",
      },
      {
        icon:        "📊",
        name:        "Panel del Promotor",
        type:        "Dashboard",
        description: "Impacte digital, intel·ligència territorial per anell d'isòcrona i gestió de campanyes per a l'organitzador.",
        href:        "dashboard.html",
        color:       "#0F7B3E",
      },
      {
        icon:        "📋",
        name:        "Presentació — Ajuntament de L'H",
        type:        "Presentació",
        description: "Presentació completa de Pulso per a l'Ajuntament de L'Hospitalet de Llobregat.",
        href:        "slides.html",
        color:       "#1565C0",
      },
      {
        icon:        "🗺️",
        name:        "Mapa de eventos — Región de Murcia",
        type:        "Demo · Murcia",
        description: "Vista jerárquica de la Región de Murcia: 1 provincia, 45 municipios, 65 eventos distribuidos. Evento estrella: Semana Santa de Lorca.",
        href:        "explore-murcia.html",
        color:       "#A06A4B",
      },
      {
        icon:        "📊",
        name:        "Panel del Promotor — Semana Santa de Lorca",
        type:        "Demo · Murcia",
        description: "Impacto digital, inteligencia territorial e isócronas para la Semana Santa de Lorca 2026.",
        href:        "dashboard-murcia.html",
        color:       "#4338CA",
      },
      {
        icon:        "✝️",
        name:        "Semana Santa de Lorca 2026",
        type:        "Demo · Evento",
        description: "Mapa cerrado del casco histórico: 6 cofradías, museos de bordados, carrera oficial y programa día a día del 27 mar al 5 abr.",
        href:        "semana-santa-lorca.html",
        color:       "#C49A4A",
      },
    ];

    // ─── Render cards ─────────────────────────────────────────────────────
    const arrowSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

    document.getElementById('demos-grid').innerHTML = SCREENS.map(s => `
      <div class="demo-card" onclick="location.href='${s.href}'">
        <div class="demo-card-accent" style="background:${s.color}"></div>
        <div class="demo-card-body">
          <span class="demo-type-badge">${s.type}</span>
          <span class="demo-icon">${s.icon}</span>
          <div class="demo-name">${s.name}</div>
          <p class="demo-description">${s.description}</p>
          <a class="demo-btn" href="${s.href}" style="background:${s.color}" onclick="event.stopPropagation()">
            Obrir ${arrowSvg}
          </a>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
