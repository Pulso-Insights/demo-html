<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revent – Demos</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F5;
      color: #212121;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #E0E0E0;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: #FF6B00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { width: 18px; height: 18px; }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: #212121;
      letter-spacing: -0.5px;
    }

    .logo-text span { color: #FF6B00; }

    .header-tag {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: #9E9E9E;
      background: #F5F5F5;
      padding: 4px 10px;
      border-radius: 6px;
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px;
    }

    /* ── Cards grid ── */
    .demos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .demo-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #E0E0E0;
      overflow: hidden;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .demo-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }

    .demo-card-accent { height: 5px; }

    .demo-card-body {
      padding: 20px 22px 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .demo-type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: #F5F5F5;
      color: #616161;
      margin-bottom: 14px;
    }

    .demo-icon {
      font-size: 26px;
      margin-bottom: 8px;
      display: block;
    }

    .demo-name {
      font-size: 17px;
      font-weight: 700;
      color: #212121;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .demo-description {
      font-size: 13px;
      color: #757575;
      line-height: 1.5;
      flex: 1;
      margin-bottom: 20px;
    }

    .demo-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      transition: filter 0.15s;
      align-self: flex-start;
    }

    .demo-btn:hover { filter: brightness(0.9); }

    .demo-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #BDBDBD;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </div>
    <span class="logo-text">Re<span>vent</span></span>
    <span class="header-tag">Demos</span>
  </header>

  <main>
    <div class="demos-grid" id="demos-grid"></div>
  </main>

  <footer>Marco Labs · Revent</footer>

  <script>
    // ─── Event configuration ──────────────────────────────────────────────
    // Update this object to switch the active event context across all demos.
    const EVENT = {
      name:     "A la tardor, platillos",
      edition:  "11a edició",
      location: "L'Hospitalet de Llobregat",
      dates:    "6 – 23 nov 2025",
      color:    "#FF6B00",
    };

    // ─── Demo screens ─────────────────────────────────────────────────────
    // Each screen is an independent view of the platform for a given event.
    const SCREENS = [
      {
        icon:        "🗺️",
        name:        "Mapa d'esdeveniments",
        type:        "Experiència usuari",
        description: "Vista jeràrquica del territori: des de la província fins al carrer. Seguiment en temps real dels participants i establiments.",
        href:        "explore.html",
        color:       "#2563EB",
      },
      {
        icon:        "📍",
        name:        "A prop teu",
        type:        "Experiència usuari",
        description: "Descobreix què tens al teu abast segons la ubicació i el temps disponible, amb isòcrones a peu i en transport públic.",
        href:        "nearme.html",
        color:       "#0EA5E9",
      },
      {
        icon:        "📊",
        name:        "Panel del Promotor",
        type:        "Dashboard",
        description: "Impacte digital, intel·ligència territorial per anell d'isòcrona i gestió de campanyes per a l'organitzador.",
        href:        "dashboard.html",
        color:       "#0F7B3E",
      },
      {
        icon:        "📋",
        name:        "Presentació — Ajuntament de L'H",
        type:        "Presentació",
        description: "Presentació completa de Revent per a l'Ajuntament de L'Hospitalet de Llobregat.",
        href:        "slides.html",
        color:       "#1565C0",
      },
    ];

    // ─── Render cards ─────────────────────────────────────────────────────
    const arrowSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

    document.getElementById('demos-grid').innerHTML = SCREENS.map(s => `
      <div class="demo-card" onclick="location.href='${s.href}'">
        <div class="demo-card-accent" style="background:${s.color}"></div>
        <div class="demo-card-body">
          <span class="demo-type-badge">${s.type}</span>
          <span class="demo-icon">${s.icon}</span>
          <div class="demo-name">${s.name}</div>
          <p class="demo-description">${s.description}</p>
          <a class="demo-btn" href="${s.href}" style="background:${s.color}" onclick="event.stopPropagation()">
            Obrir ${arrowSvg}
          </a>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
